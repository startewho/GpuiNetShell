[package]
name = "gpui-net-shell"
description = "C#-hosted shell runtime for GPUI. Rust owns native windows and materialization; C# owns the element description."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_net_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
# `gpui-base` supplies the base-layer infrastructure the host builds on
# (motion, resizable, scroll, virtual lists, `StyledExt`). Styling itself is a
# closed opcode vocabulary resolved to direct GPUI calls in `style.rs`, so the
# reflection-only `inspector` feature is deliberately not enabled.
gpui-base = { workspace = true }
gpui-component = { workspace = true }
gpui-kit-assets = { workspace = true }
# A managed thread can ask the GPUI thread to re-render; the ingress channel
# carries that request without the requester touching GPUI state.
async-channel = "2"
