[package]
name = "gpui-net-shell"
description = "C#-hosted shell runtime for GPUI. Rust owns native windows and materialization; C# owns the element description."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_net_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
# `inspector` exposes GPUI's reflected style-method table. It is what lets the
# native host resolve `items_center`, `size_full` and the rest by name, exactly
# as gpui-shell does, instead of enumerating every style as an operation code.
gpui-base = { workspace = true, features = ["inspector"] }
gpui-component = { workspace = true }
